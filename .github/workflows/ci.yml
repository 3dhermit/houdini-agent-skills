name: CI

# Tier A runs everywhere. Tier B needs a real Houdini, which GitHub-hosted
# runners cannot legally provide - so the integration job only runs on a
# self-hosted runner labelled `houdini`, and passes when none is online.
# See docs/usage.md for the licensing reason and how to attach a runner.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tier-a:
    name: Tier A (no Houdini) - py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every source file
        run: |
          python -m compileall -q houdini_skills skills tests tools
      - name: Run tier A tests
        run: python -m unittest discover -s tests -p "test_tier_a*.py" -v
      - name: Registry is generated, not hand-edited
        run: |
          python tools/make_registry.py --check
      - name: Skill tree is complete and licence-audited
        # One implementation in the repo (tools/check_skills.py), covered by a
        # tier A test - CI used to inline this walk and counted skills/__pycache__
        # as a skill folder, which failed the v1.0.0 tag push on all three Pythons.
        run: python tools/check_skills.py

  tier-b:
    name: Tier B (real Houdini, self-hosted)
    # vars.TIER_B_RUNNER is a repository variable (Settings -> Secrets and
    # variables -> Variables, set it to "true" on a machine that registers a
    # self-hosted runner labelled `houdini`). Unset means skip: a runs-on label
    # with no matching runner never starts and never fails, it just queues
    # forever, which makes the whole run unreadable and hides real red.
    if: >
      vars.TIER_B_RUNNER == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, houdini]
    continue-on-error: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate hython
        run: |
          if [ -n "$HYTHON" ]; then echo "using $HYTHON"
          else HYTHON="$(command -v hython || echo /opt/houdini/bin/hython)"; fi
          echo "HYTHON=$HYTHON" >> "$GITHUB_ENV"
          "$HYTHON" --version || true
      - name: Run tier B tests against a live Houdini
        run: |
          "$HYTHON" -m unittest discover -s tests -p "test_tier_b*.py" -v
